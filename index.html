<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FiberCalc</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0EBB80">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css?v=1">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, addDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMuNnxtjnwm1w802GOZmdfusO9y0UvWeM",
    authDomain: "fiber-calc-14.firebaseapp.com",
    projectId: "fiber-calc-14",
    storageBucket: "fiber-calc-14.firebasestorage.app",
    messagingSenderId: "8460558659",
    appId: "1:8460558659:web:02ba0268b9fa97a174cff6"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);
  const fbProvider = new GoogleAuthProvider();

  // Exposem el que necessitem al window perqu el JS principal ho usi
  window.fbAuth = fbAuth;
  window.fbDb = fbDb;
  window.fbProvider = fbProvider;
  window.fbSignInPopup = () => signInWithPopup(fbAuth, fbProvider);
  window.fbSignOut = () => signOut(fbAuth);
  window.fbOnAuth = (cb) => onAuthStateChanged(fbAuth, cb);
  window.fbDocRef = (path) => doc(fbDb, ...path.split('/'));
  window.fbGetDoc = (ref) => getDoc(ref);
  window.fbSetDoc = (ref, data) => setDoc(ref, data);
  window.fbDeleteDoc = (ref) => deleteDoc(ref);
  window.fbCollection = (path) => collection(fbDb, ...path.split('/'));
  window.fbQuery = (colRef, ...constraints) => query(colRef, ...constraints);
  window.fbWhere = where;
  window.fbGetDocs = (q) => getDocs(q);
  window.fbAddDoc = (colRef, data) => addDoc(colRef, data);
  window.fbOrderBy = orderBy;
  window.fbLimit = limit;

  // Marca que firebase ja est llest perqu el JS principal sap quan inicialitzar
  window.firebaseReady = true;
  window.dispatchEvent(new Event('firebase-ready'));
</script>
</head>
<body>
<script>
  // Decideix abans del primer pintat si es mostra la splash (1 cop per sessió; ?splash la força; mai amb moviment reduït)
  (function () {
    try {
      var t = localStorage.getItem('fibercalc-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      var forced = /[?&]splash\b/.test(location.search);
      var seen = sessionStorage.getItem('fibercalc-splash') === '1';
      var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if ((forced || !seen) && !reduced) document.documentElement.classList.add('splash-on');
    } catch (e) {}
  })();
</script>
<div id="splash" aria-hidden="true">
  <div class="splash-bg"></div>
  <div id="splash-mark" class="splash-mark">
    <div class="splash-ring-glow" id="splash-glow"><div class="splash-ring"><div class="splash-ring-spin" id="splash-spin"></div></div></div>
    <img id="splash-logo" class="splash-logo" src="logo.svg" alt="" />
  </div>
  <div id="splash-word" class="splash-word">Fiber<span class="accent">calc</span></div>
</div>
<div class="container">
  <div class="topbar">
    <div class="brand">
      <img id="brand-logo" class="brand-logo" src="logo.svg" width="42" height="42" alt="FiberCalc" />
      <h1 class="brand-name">Fiber<span class="accent">calc</span></h1>
    </div>
    <div class="topbar-actions">
      <div class="user-wrap" id="user-wrap">
        <button class="icon-action" id="login-btn" onclick="openAuthModal()" aria-label="Iniciar sessió" title="Iniciar sessió"><i class="ti ti-user"></i></button>
        <button class="user-btn" id="user-btn" onclick="toggleUserMenu()" style="display:none;">
          <span id="user-avatar"></span>
          <span id="user-shortname"></span>
        </button>
        <div class="user-menu" id="user-menu"></div>
      </div>
      <button class="icon-action" id="reorder-btn" onclick="toggleReorder()" aria-label="Reordenar"><i class="ti ti-arrows-sort"></i></button>
      <button class="icon-action" onclick="toggleTheme()" aria-label="Canviar tema"><i class="ti ti-moon" id="theme-icon"></i></button>
      <button class="btn-add" onclick="openModal()"><i class="ti ti-plus"></i>Nova assignatura</button>
    </div>
  </div>
  <div class="header">
    <div>
      <h2 class="title" id="page-title">Les meves notes</h2>
      <div class="subtitle">
        <span id="overall">—</span>
        <span id="career-tag-root"></span>
      </div>
    </div>
  </div>
  <div class="page-tabs">
    <span class="tab-indicator" aria-hidden="true"></span>
    <button class="page-tab active" id="tab-notes" onclick="switchPage('notes')"><i class="ti ti-notebook"></i><span class="tab-long">Les meves notes</span><span class="tab-short">Notes</span></button>
    <button class="page-tab" id="tab-stats" onclick="switchPage('stats')"><i class="ti ti-chart-pie"></i>Estadístiques</button>
    <button class="page-tab" id="tab-calendar" onclick="switchPage('calendar')"><i class="ti ti-calendar"></i>Calendari</button>
    <button class="page-tab" id="tab-friends" onclick="switchPage('friends')"><i class="ti ti-users"></i>Amics</button>
  </div>
  <div id="reorder-banner-root"></div>
  <div class="filter-bar" id="filter-bar"></div>
  <div id="notes-view">
    <div id="dashboard" class="dashboard"></div>
    <div id="grid" class="grid"></div>
  </div>
  <div id="stats-view" style="display:none;">
    <div id="stats-content" class="stats-grid"></div>
  </div>
  <div id="calendar-view" style="display:none;">
    <div id="calendar-content"></div>
  </div>
  <div id="friends-view" style="display:none;">
    <div id="friends-content"></div>
  </div>
  <div id="modal-root"></div>
</div>
<script src="plantilles-gei.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
