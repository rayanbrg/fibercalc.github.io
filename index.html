<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FiberCalc</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0EBB80">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
:root {
  --accent: #0EBB80;
  --accent-dark: #0A9466;
  --accent-soft: #DCF6EC;
  --bg: #F4F5F8;
  --surface: #FFFFFF;
  --surface-elev: #F9FAFC;
  --text-primary: #0B0E14;
  --text-secondary: #5A6173;
  --text-tertiary: #9CA3AE;
  --border: rgba(11,14,20,0.08);
  --border-strong: rgba(11,14,20,0.16);
  --shadow: 0 1px 3px rgba(11,14,20,0.05), 0 1px 2px rgba(11,14,20,0.04);
  --shadow-hover: 0 6px 16px rgba(11,14,20,0.08);
  --shadow-modal: 0 20px 50px rgba(11,14,20,0.18);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --pass-bg: #D9F5E6;
  --pass-text: #064E36;
  --fail-bg: #FBE2E2;
  --fail-text: #6B1818;
  --warn-bg: #FBEDD3;
  --warn-text: #4A2C04;
  --compensable-bg: #FEE9B8;
  --compensable-text: #78350F;
  --header-grad: linear-gradient(135deg, #0EBB80 0%, #14D49A 100%);
}
[data-theme="dark"] {
  --bg: #0A1224;
  --surface: #16213C;
  --surface-elev: #1F2D4A;
  --text-primary: #F1F5F9;
  --text-secondary: #94A3B8;
  --text-tertiary: #64748B;
  --border: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.20);
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-modal: 0 20px 60px rgba(0,0,0,0.5);
  --pass-bg: #0A4D38;
  --pass-text: #6EE7B7;
  --fail-bg: #4A1717;
  --fail-text: #FCA5A5;
  --warn-bg: #4A2F0A;
  --warn-text: #FCD34D;
  --compensable-bg: #3F2A0A;
  --compensable-text: #FBBF24;
  --accent-soft: rgba(14, 187, 128, 0.18);
  --header-grad: linear-gradient(135deg, #0A9466 0%, #0EBB80 50%, #14D49A 100%);
}
body { margin: 0; background: var(--bg); color: var(--text-primary); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; min-height: 100vh; transition: background 0.3s, color 0.3s; }
.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.5rem 2rem; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; gap: 12px; flex-wrap: wrap; background: var(--header-grad); padding: 14px 18px; border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { height: 42px; width: 42px; object-fit: contain; border-radius: 22%; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.5), 0 2px 6px rgba(0,0,0,0.12); }
.brand-name { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em; color: #FFFFFF; }
.brand-name .accent { color: #FFFFFF; opacity: 0.85; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.btn-add { background: #FFFFFF; color: var(--accent-dark); border: none; border-radius: var(--radius-md); padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity 0.15s, transform 0.1s, background 0.15s, box-shadow 0.15s; font-family: inherit; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
.btn-add:hover { background: #F4F5F8; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
.btn-add:active { transform: scale(0.97); }
.btn-add i { font-size: 16px; }
.icon-action { background: rgba(255,255,255,0.18); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.25); border-radius: var(--radius-md); padding: 10px 12px; font-size: 16px; cursor: pointer; display: flex; align-items: center; transition: background 0.15s, transform 0.1s, border-color 0.15s; backdrop-filter: blur(8px); }
.icon-action:hover { background: rgba(255,255,255,0.28); }
.icon-action.active { background: #FFFFFF; color: var(--accent-dark); border-color: #FFFFFF; }
.icon-action:active { transform: scale(0.95); }
.user-btn { background: rgba(255,255,255,0.18); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.25); border-radius: var(--radius-md); padding: 6px 10px 6px 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-family: inherit; transition: background 0.15s; backdrop-filter: blur(8px); }
.user-btn:hover { background: rgba(255,255,255,0.28); }
.user-btn img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
.user-btn-fallback { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.3); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.user-menu { position: absolute; top: 100%; right: 0; margin-top: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-hover); min-width: 240px; padding: 6px; display: none; z-index: 50; }
.user-menu.open { display: block; animation: fadeIn 0.15s ease; }
.user-menu-header { padding: 12px 14px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.user-menu-name { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-menu-email { font-size: 12px; color: var(--text-tertiary); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-menu-username { font-size: 12px; color: var(--accent); margin: 4px 0 0; font-weight: 600; }
.user-menu-status { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 11px; color: var(--accent); font-weight: 600; }
.user-menu-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.user-menu-item { background: transparent; border: none; width: 100%; text-align: left; padding: 9px 12px; font-size: 13px; color: var(--text-primary); cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 8px; font-family: inherit; transition: background 0.12s; }
.user-menu-item:hover { background: var(--bg); }
.user-menu-item i { font-size: 15px; color: var(--text-secondary); }
.user-menu-item.danger { color: #EF4444; }
.user-menu-item.danger i { color: #EF4444; }
.user-wrap { position: relative; }
.sync-indicator { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
.sync-indicator.active { opacity: 1; }
.sync-indicator.syncing { background: #F59E0B; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.auth-modal-content { display: flex; flex-direction: column; gap: 14px; padding: 8px 4px; align-items: center; text-align: center; }
.auth-modal-content img.brand { height: 56px; width: 56px; object-fit: contain; border-radius: 12px; }
.auth-modal-content h3 { margin: 4px 0 0; font-size: 19px; }
.auth-modal-content p { margin: 0; font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; max-width: 360px; }
.btn-google { background: #FFFFFF; color: #1F1F1F; border: 1px solid #DADCE0; border-radius: 999px; padding: 10px 22px 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-family: inherit; transition: background 0.15s, box-shadow 0.15s; }
.btn-google:hover { background: #F4F5F8; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.btn-google svg { width: 18px; height: 18px; }
.auth-error { font-size: 12px; color: #EF4444; background: var(--fail-bg); padding: 8px 12px; border-radius: var(--radius-sm); display: none; }
.auth-error.show { display: block; }
.header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.5rem; gap: 12px; flex-wrap: wrap; }
.title { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
.subtitle { font-size: 14px; color: var(--text-secondary); margin: 6px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.career-tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--accent-soft); color: var(--accent-dark); border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
.career-tag:hover { background: var(--accent); color: #fff; }
.career-tag i { font-size: 14px; }
[data-theme="dark"] .career-tag { color: #6EE7B7; }
[data-theme="dark"] .career-tag:hover { background: var(--accent); color: #fff; }
.dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
.metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: var(--shadow); }
.metric-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.metric-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.metric-label i { font-size: 14px; }
.metric-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
.metric-subvalue { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
.metric-card.accent-pass .metric-value { color: var(--accent); }
.metric-card.accent-warn .metric-value { color: #F59E0B; }
.metric-card.accent-fail .metric-value { color: #EF4444; }
.filter-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; overflow-x: auto; padding-bottom: 4px; }
.filter-chip { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; white-space: nowrap; font-family: inherit; }
.filter-chip:hover { background: var(--bg); color: var(--text-primary); }
.filter-chip.active { background: var(--text-primary); color: var(--surface); border-color: var(--text-primary); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.card { background: var(--surface); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; position: relative; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.card.passed-anim::before { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(14, 187, 128, 0.5), transparent); animation: shineSweep 1.1s ease-out; z-index: 2; pointer-events: none; }
.card.passed-anim { animation: passPulse 0.9s ease-out; }
.card.failed-anim { animation: failPulse 1.2s ease-out; }
@keyframes shineSweep { 0% { left: -100%; } 100% { left: 200%; } }
@keyframes passPulse {
  0% { transform: scale(1); box-shadow: var(--shadow); }
  30% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(14, 187, 128, 0.4), 0 8px 24px rgba(14, 187, 128, 0.3); }
  60% { transform: scale(1.02); box-shadow: 0 0 0 4px rgba(14, 187, 128, 0.2), var(--shadow-hover); }
  100% { transform: scale(1); box-shadow: var(--shadow); }
}
@keyframes failPulse {
  0% { transform: scale(1); box-shadow: var(--shadow); }
  20% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.35), 0 8px 24px rgba(239, 68, 68, 0.25); }
  40% { transform: scale(1); box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.25), var(--shadow); }
  60% { transform: scale(1.02); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.3), var(--shadow-hover); }
  80% { transform: scale(1); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15), var(--shadow); }
  100% { transform: scale(1); box-shadow: var(--shadow); }
}
.card.reorder-mode { cursor: grab; }
.card.reorder-mode:active { cursor: grabbing; }
.card.dragging { opacity: 0.5; transform: scale(0.98); }
.card.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.card-banner { padding: 16px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }

.card-header-text { display: flex; flex-direction: row; align-items: center; gap: 10px; flex: 1; min-width: 0; flex-wrap: wrap; }
.card-name { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.02em; text-transform: uppercase; line-height: 1.05; }
.card-quatri { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,0.95); background: rgba(0,0,0,0.22); padding: 3px 8px; border-radius: 6px; letter-spacing: 0.03em; flex-shrink: 0; }
.card-matricula { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,0.98); background: rgba(255,255,255,0.18); padding: 3px 8px; border-radius: 6px; letter-spacing: 0.03em; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.25); }
.card-matricula i { font-size: 12px; }
.card-matricula.first { display: none; }
.card.expanded .card-matricula.first { display: inline-flex; opacity: 0.7; }
.card-grade { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; flex-shrink: 0; }
.card-badge { width: 100%; padding: 8px 14px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 5px; text-align: center; }
.card-badge i { font-size: 14px; }
.badge-pass { background: var(--pass-bg); color: var(--pass-text); }
.badge-fail { background: var(--fail-bg); color: var(--fail-text); }
.badge-compensable { background: var(--compensable-bg); color: var(--compensable-text); }
.collapsed-parts { padding: 10px 14px 14px; display: flex; gap: 6px; flex-wrap: nowrap; background: var(--surface); align-items: center; overflow: hidden; max-height: 76px; }
.collapsed-part { background: var(--bg); border-radius: var(--radius-sm); padding: 8px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; transition: background 0.15s; flex: 1 1 0; min-width: 0; height: 48px !important; max-height: 48px !important; min-height: 48px !important; overflow: hidden; box-sizing: border-box; }
.collapsed-part-name { font-size: 11px; color: var(--text-secondary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.collapsed-part-grade { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); }
.collapsed-part.empty .collapsed-part-grade { color: var(--text-tertiary); font-weight: 600; font-size: 16px; }
.collapsed-more { background: transparent; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 8px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; flex: 1 1 0; min-width: 0; height: 48px !important; max-height: 48px !important; min-height: 48px !important; overflow: hidden; box-sizing: border-box; color: var(--text-tertiary); font-size: 11px; font-weight: 600; }
.collapsed-more strong { display: block; font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-top: 1px; }
.card-body { padding: 0 20px 18px; display: none; flex-direction: column; gap: 14px; background: var(--surface); }
.card.expanded .card-body { display: flex; padding: 4px 20px 18px; }
.card.expanded .card-header-text { flex-direction: column; gap: 6px; align-items: flex-start; }
.card.expanded .collapsed-parts { display: none; }
.parts { display: flex; flex-direction: column; gap: 10px; }
.part { display: grid; grid-template-columns: 1fr 80px 50px; gap: 10px; align-items: center; font-size: 13.5px; }
.part-name { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.input-wrapper { position: relative; }
.part input { height: 34px; font-size: 14px; padding: 0 8px; text-align: center; font-variant-numeric: tabular-nums; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-primary); font-family: inherit; outline: none; transition: border-color 0.15s, box-shadow 0.15s; width: 100%; font-weight: 500; }
.part input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ghost-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13.5px; color: var(--accent-dark); opacity: 0.8; pointer-events: none; font-variant-numeric: tabular-nums; font-weight: 600; font-style: normal; }
[data-theme="dark"] .ghost-hint { color: #6EE7B7; }
.part input:not(:placeholder-shown) ~ .ghost-hint, .part input:focus ~ .ghost-hint { display: none; }
.part-weight { text-align: right; color: var(--text-tertiary); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; }
.status-pill { font-size: 13px; padding: 10px 14px; border-radius: var(--radius-md); line-height: 1.45; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.status-pill strong { font-weight: 700; font-variant-numeric: tabular-nums; }
.status-pass { background: var(--pass-bg); color: var(--pass-text); }
.status-fail { background: var(--fail-bg); color: var(--fail-text); }
.status-warn { background: var(--warn-bg); color: var(--warn-text); }
.status-compensable { background: var(--compensable-bg); color: var(--compensable-text); }
.card-details { display: flex; flex-direction: column; }
.detail-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 12.5px; color: var(--text-secondary); border-top: 1px solid var(--border); }
.detail-row strong { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
.card-actions { display: flex; gap: 4px; justify-content: flex-end; }
.icon-btn { background: transparent; border: none; cursor: pointer; color: var(--text-tertiary); padding: 6px 8px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; font-size: 16px; transition: color 0.15s, background 0.15s; }
.icon-btn:hover { color: var(--text-primary); background: var(--bg); }
.grid-empty { text-align: center; padding: 4rem 1rem; color: var(--text-secondary); font-size: 15px; grid-column: 1/-1; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); border-radius: var(--radius-lg); padding: 1.5rem; width: min(100%, 460px); display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-modal); max-height: 90vh; overflow-y: auto; animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h3 { margin: 0; font-size: 18px; font-weight: 600; }
.modal label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px; font-weight: 500; }
.modal input[type="text"], .modal input[type="number"], .modal select { width: 100%; height: 38px; font-size: 14px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-primary); font-family: inherit; outline: none; transition: border-color 0.15s; }
.modal input:focus, .modal select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.parts-edit { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding: 2px; }
.part-edit { display: grid; grid-template-columns: 1fr 80px 32px; gap: 8px; align-items: center; }
.part-edit input { height: 34px; }
.color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
.color-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.15s, border-color 0.15s; }
.color-swatch:hover { transform: scale(1.12); }
.color-swatch.selected { border-color: var(--text-primary); transform: scale(1.12); }
.color-swatch.custom { background: linear-gradient(135deg, #FF5E5E 0%, #FFA500 25%, #FFE66D 50%, #06D6A0 75%, #118AB2 100%); position: relative; }
.color-swatch.custom::after { content: '+'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 20px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
.color-custom-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: var(--radius-sm); }
.color-custom-row input[type="color"] { width: 36px; height: 36px; border: none; padding: 0; background: transparent; cursor: pointer; border-radius: 6px; }
.color-custom-row label { margin: 0; font-size: 13px; color: var(--text-secondary); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.career-modal-list { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
.career-option { padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; transition: background 0.15s, border-color 0.15s; }
.career-option:hover { background: var(--bg); border-color: var(--border-strong); }
.career-option.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); font-weight: 600; }
[data-theme="dark"] .career-option.selected { color: #6EE7B7; }
.btn { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text-primary); font-family: inherit; transition: background 0.15s; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-ghost { background: transparent; border: none; color: var(--text-secondary); font-size: 13px; cursor: pointer; padding: 6px 10px; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-weight: 500; border-radius: var(--radius-sm); transition: color 0.15s, background 0.15s; }
.btn-ghost:hover { color: var(--text-primary); background: var(--bg); }
.warn { font-size: 12px; color: var(--warn-text); background: var(--warn-bg); padding: 8px 12px; border-radius: var(--radius-md); margin-top: 8px; }
.field-error { font-size: 12px; font-weight: 500; color: var(--fail-text); margin-top: 4px; }
.modal input.input-invalid { border-color: #EF4444; box-shadow: 0 0 0 2px var(--fail-bg); }
.eval-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px; background: var(--bg); border-radius: var(--radius-md); }
.eval-tab { background: transparent; color: var(--text-secondary); border: none; border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: background 0.15s, color 0.15s; }
.eval-tab:hover { background: var(--surface); color: var(--text-primary); }
.eval-tab.active { background: var(--surface); color: var(--text-primary); box-shadow: var(--shadow); font-weight: 600; }
.eval-tab-name { line-height: 1; }
.eval-tab-del { display: inline-flex; align-items: center; opacity: 0.5; transition: opacity 0.15s; padding: 1px; border-radius: 3px; }
.eval-tab-del:hover { opacity: 1; background: rgba(0,0,0,0.1); }
.eval-tab-del i { font-size: 13px; }
.eval-tab-add { background: transparent; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 13px; color: var(--text-tertiary); cursor: pointer; display: inline-flex; align-items: center; transition: color 0.15s, border-color 0.15s; font-family: inherit; }
.eval-tab-add:hover { color: var(--text-primary); border-color: var(--text-primary); }
.eval-name-row { display: flex; flex-direction: column; }
.eval-selector { padding: 8px 14px 0; display: flex; align-items: center; gap: 8px; background: var(--surface); }
.eval-selector label { font-size: 12px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; font-weight: 500; margin: 0; }
.eval-selector label i { font-size: 14px; }
.eval-selector select { flex: 1; height: 30px; font-size: 12.5px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text-primary); font-family: inherit; font-weight: 500; cursor: pointer; outline: none; transition: border-color 0.15s; }
.eval-selector select:hover { border-color: var(--border-strong); }
.eval-selector select:focus { border-color: var(--accent); }
.stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.stat { background: var(--surface); padding: 8px 14px; border-radius: var(--radius-md); font-size: 13px; color: var(--text-secondary); box-shadow: var(--shadow); }
.stat strong { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-primary); }
.reorder-banner { background: var(--accent-soft); color: var(--accent-dark); padding: 10px 16px; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
[data-theme="dark"] .reorder-banner { color: #6EE7B7; }
/* Page tabs */
.page-tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; background: var(--surface); padding: 5px; border-radius: var(--radius-md); border: 1px solid var(--border); width: fit-content; box-shadow: var(--shadow); }
.page-tab { background: transparent; color: var(--text-secondary); border: none; border-radius: var(--radius-sm); padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-family: inherit; transition: background 0.2s, color 0.2s; }
.page-tab:hover { color: var(--text-primary); }
.page-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(14,187,128,0.3); }
.page-tab i { font-size: 16px; }

/* Statistics view */
.stats-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.stat-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; transition: transform 0.2s, box-shadow 0.2s; }
.stat-block:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-block-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat-block-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.stat-block-title i { font-size: 17px; color: var(--accent); }
.stat-block-subtitle { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
.span-3 { grid-column: span 3; }
.span-4 { grid-column: span 4; }
.span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; }
.span-8 { grid-column: span 8; }
.span-12 { grid-column: span 12; }

/* Cercle de progres */
.progress-circle-wrap { display: flex; align-items: center; justify-content: center; padding: 8px 0; }
.progress-circle { position: relative; width: 160px; height: 160px; }
.progress-circle svg { transform: rotate(-90deg); }
.progress-circle-track { stroke: var(--border); fill: none; }
.progress-circle-bar { stroke: var(--accent); fill: none; stroke-linecap: round; transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
.progress-circle-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.progress-circle-value { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1; }
.progress-circle-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
.progress-circle-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* Big number block */
.big-number { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--text-primary); line-height: 1; }
.big-number .unit { font-size: 18px; color: var(--text-tertiary); font-weight: 600; margin-left: 4px; }
.big-number-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.big-number-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

/* Bar chart simple */
.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 80px 1fr 50px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row-label { color: var(--text-secondary); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-row-track { background: var(--bg); border-radius: 999px; height: 18px; position: relative; overflow: hidden; }
.bar-row-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
.bar-row-fill.pass { background: var(--accent); }
.bar-row-fill.fail { background: #EF4444; }
.bar-row-fill.warn { background: #F59E0B; }
.bar-row-value { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); }

/* Vertical bar chart per quatri */
.v-bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
.v-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; height: 100%; }
.v-bar-track { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
.v-bar-fill { width: 100%; background: linear-gradient(180deg, #14D49A 0%, #0EBB80 100%); border-radius: 8px 8px 0 0; transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; min-height: 4px; }
.v-bar-fill.fail { background: linear-gradient(180deg, #FB7185 0%, #EF4444 100%); }
.v-bar-fill.warn { background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%); }
.v-bar-value { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); white-space: nowrap; }
.v-bar-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; text-align: center; }

/* Donut (pastis) */
.donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
.donut svg { transform: rotate(-90deg); }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.donut-center-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: var(--text-primary); }
.donut-center-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 130px; }
.donut-legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.donut-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.donut-legend-label { color: var(--text-secondary); flex: 1; font-weight: 500; }
.donut-legend-value { color: var(--text-primary); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Line chart per ECTS acumulats */
.line-chart-wrap { padding: 8px 0; height: 180px; position: relative; }
.line-chart-svg { width: 100%; height: 100%; overflow: visible; }
.line-chart-area { fill: url(#area-gradient); opacity: 0.2; }
.line-chart-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; transition: stroke-dashoffset 1.5s ease-out; }
.line-chart-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; transition: r 0.2s; }
.line-chart-dot:hover { r: 6; }
.line-chart-label { font-size: 10px; fill: var(--text-tertiary); font-weight: 500; text-anchor: middle; }
.line-chart-value { font-size: 11px; fill: var(--text-primary); font-weight: 700; text-anchor: middle; }

/* Top assignatures */
.top-list { display: flex; flex-direction: column; gap: 8px; }
.top-item { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg); transition: transform 0.15s; }
.top-item:hover { transform: translateX(2px); }
.top-rank { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--text-tertiary); }
.top-rank.first { background: linear-gradient(135deg, #FFD700, #FFA500); }
.top-rank.second { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); }
.top-rank.third { background: linear-gradient(135deg, #CD7F32, #8B4513); }
.top-name { font-size: 13.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-meta { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
.top-grade { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.top-grade.pass { color: var(--accent); }
.top-grade.fail { color: #EF4444; }
.top-grade.warn { color: #F59E0B; }

/* Histograma de notes */
.histogram { display: flex; align-items: flex-end; gap: 4px; height: 130px; padding-top: 10px; }
.histo-bar { flex: 1; background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%); border-radius: 6px 6px 0 0; position: relative; min-height: 4px; transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
.histo-bar.r1 { background: linear-gradient(180deg, #F87171 0%, #EF4444 100%); }
.histo-bar.r2 { background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%); }
.histo-bar.r3 { background: linear-gradient(180deg, #34D399 0%, #10B981 100%); }
.histo-bar.r4 { background: linear-gradient(180deg, #22C55E 0%, #16A34A 100%); }
.histo-value { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--text-primary); }
.histo-labels { display: flex; gap: 4px; margin-top: 8px; }
.histo-label { flex: 1; text-align: center; font-size: 10px; color: var(--text-secondary); font-weight: 600; }

/* Empty state per stats */
.stats-empty { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; color: var(--text-secondary); font-size: 14px; background: var(--surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-strong); }
.stats-empty i { font-size: 36px; color: var(--text-tertiary); display: block; margin-bottom: 12px; }

/* Linia de mitjana per quatri */
.avg-line-wrap { padding: 16px 0 8px; height: 200px; position: relative; }
.avg-line-svg { width: 100%; height: 100%; overflow: visible; }
.avg-line-grid { stroke: var(--border); stroke-width: 0.5; stroke-dasharray: 3 3; }
.avg-line-grid-label { font-size: 9px; fill: var(--text-tertiary); font-weight: 500; }
.avg-line-fill { fill: url(#avg-area-gradient); opacity: 0.18; transition: opacity 0.4s; }
.avg-line-path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.avg-line-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; cursor: pointer; transition: r 0.2s; }
.avg-line-dot:hover { r: 7; }
.avg-line-dot.fail { fill: #EF4444; }
.avg-line-dot.warn { fill: #F59E0B; }
.avg-line-value { font-size: 10.5px; fill: var(--text-primary); font-weight: 700; text-anchor: middle; }
.avg-line-label { font-size: 10px; fill: var(--text-tertiary); font-weight: 600; text-anchor: middle; }
.avg-line-baseline { stroke: #EF4444; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.5; }
.avg-line-baseline-label { font-size: 9px; fill: #EF4444; font-weight: 600; opacity: 0.7; }

/* Heatmap de quatris */
.heatmap { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
.heatmap-row { display: flex; gap: 6px; align-items: center; }
.heatmap-year-label { width: 56px; font-size: 11px; color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }
.heatmap-cells { display: flex; gap: 6px; flex: 1; }
.heatmap-cell { flex: 1; aspect-ratio: 1.6 / 1; min-width: 0; border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; padding: 4px; }
.heatmap-cell:hover { transform: scale(1.06); box-shadow: var(--shadow-hover); z-index: 1; }
.heatmap-cell-empty { background: var(--bg); color: var(--text-tertiary); border: 1px dashed var(--border-strong); font-size: 14px; }
.heatmap-cell-q { font-size: 9px; opacity: 0.85; font-weight: 600; letter-spacing: 0.04em; }
.heatmap-cell-val { font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.heatmap-legend { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-secondary); margin-top: 12px; flex-wrap: wrap; }
.heatmap-legend-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; flex: 1; max-width: 200px; min-width: 100px; }
.heatmap-legend-bar > div { flex: 1; }


/* Calendar view */
.calendar-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; margin-top: 4px; }
.calendar-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; box-shadow: var(--shadow); }
.cal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.cal-month-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin: 0; letter-spacing: -0.01em; text-transform: capitalize; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 14px; cursor: pointer; color: var(--text-primary); transition: background 0.15s; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
.cal-nav button:hover { background: var(--bg); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--text-tertiary); font-weight: 600; padding: 6px 0; text-transform: uppercase; letter-spacing: 0.05em; }
.cal-day { aspect-ratio: 1 / 1; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; cursor: pointer; transition: background 0.15s, transform 0.1s; position: relative; min-height: 56px; }
.cal-day:hover { background: var(--surface-elev); transform: scale(1.02); }
.cal-day.other-month { opacity: 0.35; }
.cal-day.today { background: var(--accent-soft); border: 1px solid var(--accent); }
.cal-day-num { font-weight: 600; color: var(--text-primary); font-size: 12px; }
.cal-day.today .cal-day-num { color: var(--accent-dark); font-weight: 800; }
[data-theme="dark"] .cal-day.today .cal-day-num { color: #6EE7B7; }
.cal-day-events { display: flex; flex-wrap: wrap; gap: 2px; margin-top: auto; }
.cal-day-dot { width: 6px; height: 6px; border-radius: 50%; }
.cal-day-more { font-size: 9px; color: var(--text-tertiary); font-weight: 600; margin-top: 1px; }

.event-list-section { margin-bottom: 18px; }
.event-list-title { font-size: 12px; color: var(--text-tertiary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.event-list-title i { font-size: 14px; }
.event-list { display: flex; flex-direction: column; gap: 8px; }
.event-item { display: grid; grid-template-columns: 4px 56px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-md); cursor: pointer; transition: transform 0.15s, background 0.15s; }
.event-item:hover { transform: translateX(2px); background: var(--surface-elev); }
.event-item.past { opacity: 0.55; }
.event-color-bar { width: 4px; height: 32px; border-radius: 2px; }
.event-date { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.event-date-day { font-size: 18px; font-weight: 800; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.event-date-month { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; font-weight: 600; margin-top: 2px; letter-spacing: 0.05em; }
.event-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.event-title { font-size: 14px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-subtitle { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.event-type-pill { font-size: 10px; padding: 2px 6px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
.event-countdown { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.event-countdown.urgent { color: #EF4444; }
.event-countdown.soon { color: #F59E0B; }
.event-countdown.today { color: var(--accent); }
.event-countdown.past { color: var(--text-tertiary); }

.event-add-btn { width: 100%; padding: 10px; background: var(--accent-soft); color: var(--accent-dark); border: 1px dashed var(--accent); border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; transition: background 0.15s; margin-bottom: 12px; }
.event-add-btn:hover { background: var(--accent); color: #fff; }
[data-theme="dark"] .event-add-btn { color: #6EE7B7; }
[data-theme="dark"] .event-add-btn:hover { color: #fff; }

/* Compte enrere al dashboard */
.countdown-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: var(--shadow); grid-column: span 1; }
.countdown-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.countdown-title { font-size: 12px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.countdown-title i { font-size: 14px; color: var(--accent); }
.countdown-events { display: flex; flex-direction: column; gap: 6px; }
.countdown-event { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }
.countdown-event-name { font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Stats selector */

/* Friends */
.friend-search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.friend-search-bar input { flex: 1; height: 42px; font-size: 14px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--text-primary); font-family: inherit; outline: none; transition: border-color 0.15s; }

.friend-info { flex: 1; min-width: 0; }
.friend-name { font-size: 14px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friend-username { font-size: 12px; color: var(--text-tertiary); }
.friend-action { flex-shrink: 0; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.friend-status-badge { font-size: 12px; font-weight: 600; color: var(--text-secondary); background: var(--bg); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.friends-empty { text-align: center; padding: 3rem 2rem; color: var(--text-secondary); font-size: 14px; background: var(--surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-strong); }

.position-banner { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; padding: 14px 18px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 10px; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(14,187,128,0.25); animation: slideUp 0.4s ease; }
.position-banner.demote { background: linear-gradient(135deg, #6E7280, #4B5563); box-shadow: 0 4px 14px rgba(75,85,99,0.25); }
.position-banner.promote-top { background: linear-gradient(135deg, #FFD700, #FFA500); color: #1A1A1A; box-shadow: 0 4px 14px rgba(255,165,0,0.35); }

.avatar-rank-ring { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--avatar-ring, var(--border-strong)); }
.sparkline { display: inline-block; vertical-align: middle; margin-left: 8px; flex-shrink: 0; }

.star-quatri-block { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.star-quatri-name { font-size: 16px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.star-quatri-grade { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }

.delta-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; vertical-align: middle; margin-left: 6px; font-variant-numeric: tabular-nums; }
.delta-badge.up { background: rgba(14,187,128,0.15); color: var(--accent-dark); }
[data-theme="dark"] .delta-badge.up { color: #6EE7B7; }
.delta-badge.down { background: rgba(239,68,68,0.15); color: #DC2626; }

.compare-chart-wrap { padding: 16px 0 8px; height: 220px; position: relative; }
.compare-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; }
.compare-legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.compare-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
[data-theme="dark"] .rank-you-badge { color: #6EE7B7; }
.friend-quatri-select { height: 40px; font-size: 14px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--text-primary); font-family: inherit; outline: none; cursor: pointer; }
.friend-quatri-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

@media (max-width: 900px) {
  .span-3, .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
  .calendar-layout { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  .container { padding: 1rem; }
  .title { font-size: 24px; }
  .grid { grid-template-columns: 1fr; gap: 14px; }
  .brand-name { font-size: 18px; }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, addDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMuNnxtjnwm1w802GOZmdfusO9y0UvWeM",
    authDomain: "fiber-calc-14.firebaseapp.com",
    projectId: "fiber-calc-14",
    storageBucket: "fiber-calc-14.firebasestorage.app",
    messagingSenderId: "8460558659",
    appId: "1:8460558659:web:02ba0268b9fa97a174cff6"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);
  const fbProvider = new GoogleAuthProvider();

  // Exposem el que necessitem al window perqu el JS principal ho usi
  window.fbAuth = fbAuth;
  window.fbDb = fbDb;
  window.fbProvider = fbProvider;
  window.fbSignInPopup = () => signInWithPopup(fbAuth, fbProvider);
  window.fbSignOut = () => signOut(fbAuth);
  window.fbOnAuth = (cb) => onAuthStateChanged(fbAuth, cb);
  window.fbDocRef = (path) => doc(fbDb, ...path.split('/'));
  window.fbGetDoc = (ref) => getDoc(ref);
  window.fbSetDoc = (ref, data) => setDoc(ref, data);
  window.fbDeleteDoc = (ref) => deleteDoc(ref);
  window.fbCollection = (path) => collection(fbDb, ...path.split('/'));
  window.fbQuery = (colRef, ...constraints) => query(colRef, ...constraints);
  window.fbWhere = where;
  window.fbGetDocs = (q) => getDocs(q);
  window.fbAddDoc = (colRef, data) => addDoc(colRef, data);
  window.fbOrderBy = orderBy;
  window.fbLimit = limit;

  // Marca que firebase ja est llest perqu el JS principal sap quan inicialitzar
  window.firebaseReady = true;
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<body>
<div class="container">
  <div class="topbar">
    <div class="brand">

      <button class="icon-action" onclick="toggleTheme()" aria-label="Canviar tema"><i class="ti ti-moon" id="theme-icon"></i></button>
      <button class="btn-add" onclick="openModal()"><i class="ti ti-plus"></i>Nova assignatura</button>
